name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests (цветовая математика, коды)
        run: npm test

      - name: Smoke-test WinAPI bindings (koffi)
        shell: pwsh
        run: node -e "const w=require('./src/main/engine/win32'); console.log('displays', JSON.stringify(w.listDisplays())); console.log('fg', JSON.stringify(w.foregroundExe()));"

      - name: Build installer + portable
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: QWECOLORS-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: GitHub Release (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = (Get-ChildItem release/*.exe).FullName
          gh release create "${{ github.ref_name }}" @files --title "QWECOLORS ${{ github.ref_name }}" --generate-notes
